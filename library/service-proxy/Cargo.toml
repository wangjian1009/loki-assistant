[package]
name = "loki-service-proxy"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
http = "1"
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
