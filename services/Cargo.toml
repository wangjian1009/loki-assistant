[package]
name = "loki-services"
version = "0.1.0"
edition = "2024"
description = "Loki Assistant 控制中心服务层"
license = "MIT"

[dependencies]
axum = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
