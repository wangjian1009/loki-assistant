[package]
name = "loki-services"
version = "0.1.0"
edition = "2024"
description = "Loki Assistant 控制中心服务层"
license = "MIT"

[workspace]
members = ["macros"]
resolver = "2"

[dependencies]
axum = "0.8"
linkme = "0.3"
libc = "0.2"
loki-services-macros = { path = "macros" }
percent-encoding = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
