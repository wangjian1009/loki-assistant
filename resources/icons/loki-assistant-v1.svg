<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <title>Loki Assistant 图标：对话中的 L</title>
  <desc>深绿圆角底上的薄荷色 L 与回应气泡，用于各平台应用图标。</desc>
  <defs>
    <linearGradient id="base" x1="200" y1="70" x2="810" y2="960" gradientUnits="userSpaceOnUse">
      <stop stop-color="#183F3B"/>
      <stop offset="0.56" stop-color="#102B2A"/>
      <stop offset="1" stop-color="#0B1E20"/>
    </linearGradient>
    <radialGradient id="light" cx="0" cy="0" r="1" gradientTransform="translate(300 150) rotate(55) scale(790 700)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5AE3BA" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#5AE3BA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="250" y1="100" x2="740" y2="920" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.035"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.07"/>
    </linearGradient>
    <linearGradient id="mark" x1="324" y1="280" x2="700" y2="750" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E5FFF4"/>
      <stop offset="0.48" stop-color="#B6F8DD"/>
      <stop offset="1" stop-color="#6BE2B7"/>
    </linearGradient>
    <linearGradient id="reply" x1="539" y1="288" x2="718" y2="447" gradientUnits="userSpaceOnUse">
      <stop stop-color="#83F6CB"/>
      <stop offset="1" stop-color="#43D1AD"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="1024" height="1024" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="19" flood-color="#031815" flood-opacity="0.28"/>
    </filter>
  </defs>
  <g id="rounded-background">
    <rect x="64" y="64" width="896" height="896" rx="202" fill="url(#base)"/>
    <rect x="64" y="64" width="896" height="896" rx="202" fill="url(#light)"/>
    <rect x="65.5" y="65.5" width="893" height="893" rx="200.5" stroke="url(#edge)" stroke-width="3"/>
  </g>
  <g id="harmony-background" display="none">
    <rect width="1024" height="1024" fill="url(#base)"/>
    <rect width="1024" height="1024" fill="#69CBAF" opacity="0.18"/>
    <rect width="1024" height="1024" fill="url(#light)"/>
  </g>
  <g id="foreground" filter="url(#shadow)">
    <path d="M356 280C326 280 302 304 302 334V590C302 660 358 716 428 716H548V754C548 770 568 778 580 768L708 669C729 653 718 620 692 620H444C431 620 420 609 420 596V334C420 304 396 280 366 280H356Z" fill="url(#mark)"/>
    <path d="M579 280H666C697 280 722 305 722 336V365C722 396 697 421 666 421H636L589 460C578 469 563 461 563 447V419C539 412 522 390 522 365V336C522 305 547 280 579 280Z" fill="url(#reply)"/>
  </g>
</svg>
