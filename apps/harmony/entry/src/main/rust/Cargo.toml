[package]
name = "loki-mobile-network"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
http = "1"
libc = "0.2"
loki-service-proxy = { path = "../../../../../../library/service-proxy" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[target.'cfg(target_env = "ohos")'.dependencies]
napi-ohos = { version = "=1.2.0", features = ["serde-json", "tokio_rt"] }
napi-derive-ohos = "=1.2.0"

[build-dependencies]
napi-build-ohos = "=1.2.0"
