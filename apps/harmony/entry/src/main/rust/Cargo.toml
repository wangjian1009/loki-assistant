[package]
name = "loki-mobile-probe"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
anyhow = "1"
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
